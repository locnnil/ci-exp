name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  build:
    runs-on: ubuntu-latest
    # env:
      # PR_NUMBER: ${{ github.event.pull_request.number }} # TODO: Try this latter
        # PR_NUMBER: ${{ github.event.number }}
        # RUN: ${{ github.run_number}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Kernel errors
        run: |
          sudo dmesg -l err

      - name: Check Kernel criticals
        run: |
          sudo dmesg -l crit
          
      - name: Check Kernel alerts
        run: |
          sudo dmesg -l alert

      - name: Check Kernel emergs
        run: |
          sudo dmesg -l emerg

      - name: Check default shell
        run: |
          echo -e "The default shel is: $0\n"
          
      - name: install Docker
        run: sudo snap install docker --beta

      - name: Check kernel again
        run: echo ""

      - name: Check Kernel errors
        run: |
          sudo dmesg -l err

      - name: Check Kernel criticals
        run: |
          sudo dmesg -l crit
          
      - name: Check Kernel alerts
        run: |
          sudo dmesg -l alert

      - name: Check Kernel emergs
        run: |
          sudo dmesg -l emerg

      - name: Check default shell
        run: |
          echo -e "The default shel is: $0\n"
          
      - name: install Docker
        run: sudo snap install docker --beta
              
      - name: Build
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          snapcraft-args: pack --output test_${{ github.run_id}}.snap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test_${{ github.run_id}}.snap
          path: ${{ steps.snapcraft.outputs.snap }}

